# DJI Zenmuse L2 - aerial LiDAR + RGB payload for drones.
sensor:
  vendor: DJI
  model: Zenmuse L2
  category: aerial_lidar
  outputs:
    - LAS
  scanning_mechanism: "Non-repetitive scanning LiDAR (per DJI public specs)"
  range_precision_mm: null  # TODO: cite exact figure from DJI's published datasheet
  detection_range_note: >
    DJI publishes detection range figures dependent on reflectivity and
