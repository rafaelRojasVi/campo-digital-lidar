  registration_method: "Direct georeferencing via onboard RTK GNSS + IMU (when RTK fixed)"
  typical_use_in_this_project: >
    Aerial overview capture of stockpile/timber-stack yards; likely lower
    point density on vertical faces of stacks compared to terrestrial scans.
  crs_handling: >
    RTK base station CRS/datum must be explicitly recorded per flight;
    never assumed from file alone.
