name: Quality CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python
        run: uv python install 3.12.13

      - name: Check architecture boundaries
        run: uv run --no-project --python 3.12.13 python scripts/check_architecture_boundaries.py

      - name: Scan full Git history for secrets
        run: ./scripts/check_secrets.sh
