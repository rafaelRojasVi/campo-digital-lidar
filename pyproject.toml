[project]
name = "campo-digital-platform"
version = "0.1.0"
description = "Multi-product geospatial and forestry software platform for Campo Digital"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "laspy[lazrs]>=2.5",
  "pyproj>=3.6",
  "shapely>=2.0",
  "scikit-learn>=1.5",
  "trimesh>=4.4",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
analysis = [
  "jupyterlab>=4.2",
]
transelec = [
  "python-calamine>=0.8,<0.9",
]
geometry-extra = [
  "open3d>=0.18",
  "pyvista>=0.44",
]
api = [
  "alembic>=1.13",
  "fastapi>=0.111",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
  "msal>=1.28,<2",
  "pyjwt[crypto]>=2.10,<3",
  "cryptography>=49.0",
]

[project.scripts]
lidar = "lidar_cli.main:app"

[tool.uv]
required-version = "==0.12.5"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "products/lidar/src/lidar_core",
  "products/lidar/src/lidar_io",
  "products/lidar/src/lidar_volume",
  "products/lidar/src/lidar_cli",
  "products/transelect/src/transelec_ingestion",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pre-commit>=3.8",
  "mypy>=1.11",
  "httpx>=0.27",
  "xlsxwriter>=3.2,<4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["products/lidar/src", "products/lidar/tests", "products/transelect/src", "products/transelect/tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "products/lidar/src:products/transelect/src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["products/lidar/notebooks", "external"]

[tool.pytest.ini_options]
testpaths = ["products/lidar/tests", "products/transelect/tests", "apps/api/tests", "tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["products/lidar/src", "products/transelect/src"]
