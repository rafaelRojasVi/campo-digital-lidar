[project]
name = "campo-digital-lidar"
version = "0.1.0"
description = "LiDAR/point-cloud engineering PoC for Campo Digital timber-stack volume measurement"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "laspy[lazrs]>=2.5",
  "pyproj>=3.6",
  "shapely>=2.0",
  "scikit-learn>=1.5",
  "trimesh>=4.4",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "matplotlib>=3.9",
  "jupyterlab>=4.2",
]

[project.optional-dependencies]
geometry-extra = [
  "open3d>=0.18",
  "pyvista>=0.44",
]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.scripts]
lidar = "lidar_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/lidar_core",
  "src/lidar_io",
  "src/lidar_volume",
  "src/lidar_cli",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pre-commit>=3.8",
  "mypy>=1.11",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["notebooks", "external"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
